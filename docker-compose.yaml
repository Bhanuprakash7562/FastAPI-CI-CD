services:
  postgresdb:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_DB: fastapiProject
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "Iamironman2268$"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5
  myapp:
      image: bhanuprakash7562/fastapi-app:version1
      container_name: fastapi_app
      ports:
        - "6500:7562"
      depends_on:
        postgresdb:
          condition: service_healthy
      environment:
        DATABASE_URL: "postgresql://postgres:Iamironman2268$@postgresdb:5432/fastapiProject"

volumes:
  postgres_data: